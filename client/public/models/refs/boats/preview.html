<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boat refs — Meshy</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #eee;
      padding: 1.5rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
    p { color: #aaa; margin: 0 0 1.5rem; font-size: 0.9rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      max-width: 960px;
    }
    figure {
      margin: 0;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 0.6rem 0.85rem;
      background: #2a2a2a;
      font-size: 0.9rem;
      color: #bbb;
    }
    figcaption strong { color: #eee; }
  </style>
</head>
<body>
  <h1>Boat Meshy reference images</h1>
  <p>Studio white background · ready for image-to-3D</p>
  <div class="grid">
    <figure>
      <img src="./boat1-simple-wood-sail.png" alt="Boat 1 simple wood sail" />
      <figcaption><strong>Boat 1</strong> — Simple wood sail boat (red mainsail, blue jib)</figcaption>
    </figure>
    <figure>
      <img src="./boat2-wood-schooner.png" alt="Boat 2 wood schooner" />
      <figcaption><strong>Boat 2</strong> — Wood schooner (two masts, white sails)</figcaption>
    </figure>
    <figure>
      <img src="./boat3-simple-wood-variation.png" alt="Boat 3 variation" />
      <figcaption><strong>Boat 3</strong> — Variation (red/white DEE hull)</figcaption>
    </figure>
    <figure>
      <img src="./boat4-single-sail.png" alt="Boat 4 single sail" />
      <figcaption><strong>Boat 4</strong> — Single sail (minimalist light wood)</figcaption>
    </figure>
  </div>
</body>
</html>
